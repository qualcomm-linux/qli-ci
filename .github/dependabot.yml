version: 2

updates:
  # Workflow actions are pinned to commit SHAs so that a moved tag or branch
  # cannot change what runs in CI. That safety only holds if the pins are kept
  # current, which is what this does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting a new release, so a compromised or botched
    # publish has a window to be caught before it lands in a pin.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
