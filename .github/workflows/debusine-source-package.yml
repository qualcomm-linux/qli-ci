# Generate half of Debusine CI: generate the source package from a packaging
# tree and upload it as the source-package-<job_index> artifact. In release
# mode, also prepare the release commit and tag and upload them as the
# release-bundle-<job_index> artifact.
#
# Nothing here needs a secret or writes anything, so it is also safe to call
# from a pull_request workflow, where fork PRs get a read-only token and no
# secrets (debusine-pr-hook.yml). debusine-build.yml takes the artifact as
# data only, so it never trusts what ran here.

name: Debusine source package

on:
  workflow_call:
    inputs:
      target_branch:
        description: Where the packaging will land (or for dailies, has landed)
        type: string
        required: true
      source_ref:
        description: What packaging to check out. Defaults to the PR head SHA for pull_request, otherwise github.ref.
        type: string
        required: false
      release:
        description: Also prepare the release commit and tag
        type: boolean
        required: false
        default: false
      qli-ci-ref:
        description: Ref of qualcomm-linux/qli-ci to check out for helper scripts
        type: string
        required: false
        default: main
      job_index:
        description: Uniquely identifying index for matrix strategies; must match the job_index passed to debusine-build.yml
        type: string
        required: false
        default: "0"

permissions: {}

jobs:
  resolve:
    name: Resolve target branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      suite: ${{ steps.resolve.outputs.suite }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      debusine_target_workspace: ${{ steps.resolve.outputs.debusine_target_workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qualcomm-linux/qli-ci
          ref: ${{ inputs.qli-ci-ref }}
          path: qli-ci
          persist-credentials: false
      - id: resolve
        name: Map branch to suite
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: qli-ci/lib/resolve-target-branch

  source-package:
    name: Prepare source package
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qualcomm-linux/debusine-pkg-builder:${{ needs.resolve.outputs.suite }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Using the parent directory for Debian build artifacts is problematic, for example breaking actions/upload-artifact:
          # https://github.com/actions/upload-artifact/issues/176
          path: srcpkg
          ref: ${{ needs.resolve.outputs.source_ref }}
          # Shallow (default fetch-depth: 1) on purpose: qli-ci/lib/
          # prepare-release only needs HEAD, and qli-ci/lib/
          # generate-source-package fetches the pristine-tar branch and the
          # one upstream tag gbp needs from origin itself. Keep credentials
          # for those fetches; the token is read-only here, and srcpkg/ is
          # never uploaded as an artifact.
          persist-credentials: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qualcomm-linux/qli-ci
          ref: ${{ inputs.qli-ci-ref }}
          path: qli-ci
          persist-credentials: false
      - name: Prepare release
        if: ${{ inputs.release }}
        env:
          SUITE: ${{ needs.resolve.outputs.suite }}
          DEBUSINE_TARGET_WORKSPACE: ${{ needs.resolve.outputs.debusine_target_workspace }}
        run: |
          set -ex
          qli-ci/lib/prepare-release
      - id: generate-source-package
        name: Generate source package
        run: |
          set -ex
          qli-ci/lib/generate-source-package
      - name: Stage source package files
        env:
          CHANGES_PATH: ${{ steps.generate-source-package.outputs.changes_path }}
        run: |
          set -eux
          mkdir source-package
          dcmd cp "$CHANGES_PATH" source-package/
      - name: Upload source package files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-package-${{ inputs.job_index }}
          path: source-package
          if-no-files-found: error
          # Long enough for debusine-pr-check.yml, which downloads it from
          # the hook run once that completes.
          retention-days: 3
      - name: Upload release bundle
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ inputs.job_index }}
          path: release.bundle
          if-no-files-found: error
