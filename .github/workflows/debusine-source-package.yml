# Untrusted half of PR CI: generate the source package from the PR head and
# upload it as an artifact. Called from a pull_request workflow, which for
# fork PRs runs with a read-only token and no secrets. Nothing here may need a
# secret or write anything; the trusted workflow_run side (debusine-pr-check.yml,
# then debusine.yml with import_source_package) takes the artifact as data only.

name: Debusine source package

on:
  workflow_call:
    inputs:
      target_branch:
        description: Branch the PR targets, used to pick the builder suite
        type: string
        required: true
      qli-ci-ref:
        description: Ref of qualcomm-linux/qli-ci to check out for helper scripts
        type: string
        required: false
        default: main
      job_index:
        description: Must match the job_index the trusted side passes to debusine.yml
        type: string
        required: false
        default: "0"

permissions: {}

jobs:
  resolve:
    name: Resolve suite
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.map_suite.outputs.suite }}
    steps:
      - id: map_suite
        name: Map branch to suite
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        with:
          script: |
            const suffixToSuite = {
              "debian/latest": "forky",
              "debian/trixie": "trixie",
            };
            const prefixes = ['qli-staging/', 'qli/', 'qcom/'];
            const targetBranch = process.env.TARGET_BRANCH;
            const prefix = prefixes.find(p => targetBranch.startsWith(p));
            if (!prefix) {
              core.setFailed(`Unknown target branch prefix: ${targetBranch}`);
              return;
            }
            const suite = suffixToSuite[targetBranch.slice(prefix.length)];
            if (!suite) {
              core.setFailed(`Unknown branch suffix in ${targetBranch}`);
              return;
            }
            core.setOutput('suite', suite);

  source-package:
    name: Prepare source package
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qualcomm-linux/debusine-pkg-builder:${{ needs.resolve.outputs.suite }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: srcpkg
          ref: ${{ github.event.pull_request.head.sha }}
          # Keep credentials: qli-ci/lib/generate-source-package fetches
          # pristine-tar and upstream tag refs from origin afterward. The token
          # is this run's own read-only one (no secrets in fork PR runs), and
          # srcpkg/ is never uploaded as an artifact.
          persist-credentials: true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: qualcomm-linux/qli-ci
          ref: ${{ inputs.qli-ci-ref }}
          path: qli-ci
          persist-credentials: false
      - id: generate-source-package
        name: Generate source package
        run: |
          set -ex
          qli-ci/lib/generate-source-package
      - name: Stage source package files
        env:
          CHANGES_PATH: ${{ steps.generate-source-package.outputs.changes_path }}
        run: |
          set -eux
          mkdir source-package
          dcmd cp "$CHANGES_PATH" source-package/
      - name: Upload source package files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-package-${{ inputs.job_index }}
          path: source-package
          if-no-files-found: error
          retention-days: 3
