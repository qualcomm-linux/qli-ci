# Debusine CI for trusted callers (debusine-daily.yml, debusine-release.yml):
# generate the source package from a packaging branch, build it in Debusine,
# and optionally release it. Each step is its own reusable workflow:
#
#   debusine-source-package.yml  checkout + generate -> artifact (read-only)
#   debusine-build.yml           validate artifact -> Debusine build
#   debusine-publish.yml         Debusine release + push release commit/tag
#
# PR CI does not use this wrapper: debusine-pr-hook.yml calls
# debusine-source-package.yml and debusine-pr-check.yml calls
# debusine-build.yml, so it is never granted write permissions or
# DEBUSINE_RELEASE_TOKEN.
#
# The nested calls use the self-repository ($/) syntax, so they always come
# from the same qli-ci commit as this file, whatever ref the caller pinned it
# to.

name: Debusine CI

on:
  workflow_call:
    inputs:
      target_branch:
        description: Where the packaging will land (or for dailies, has landed)
        type: string
        required: true
      source_ref:
        description: What packaging to test. Defaults to using github.ref.
        type: string
        required: false
      release:
        description: Run release step
        type: boolean
        required: true
        default: true
      qli-ci-ref:
        description: Ref of qualcomm-linux/qli-ci to check out for helper scripts
        type: string
        required: false
        default: main
      debusine-parent-workspace:
        description: Parent Debusine workspace used to create per-run CI child workspaces
        type: string
        required: false
        default: qli-ci
      workflow_kind:
        description: Which caller this is - one of PR, DAILY, RELEASE
        type: string
        required: false
        default: ""
      job_index:
        # This is used to generate a unique Debusine child workspace name for
        # each expansion of the matrix
        description: Uniquely identifying index for matrix strategies
        type: string
        required: false
        default: "0"
    secrets:
      DEBUSINE_USER:
        required: true
      DEBUSINE_TOKEN:
        required: true
      DEBUSINE_RELEASE_TOKEN:
        required: true

# Release runs for the same branch share a group (preventing concurrent
# releases), while non-release runs get unique groups (allowing concurrent
# execution)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target_branch }}-${{ inputs.release && 'release' || github.run_id }}

permissions: {}

jobs:
  source-package:
    name: Source package
    permissions:
      contents: read
      packages: read
    uses: $/.github/workflows/debusine-source-package.yml
    with:
      target_branch: ${{ inputs.target_branch }}
      source_ref: ${{ inputs.source_ref }}
      release: ${{ inputs.release }}
      qli-ci-ref: ${{ inputs.qli-ci-ref }}
      job_index: ${{ inputs.job_index }}

  build:
    name: Build
    needs: source-package
    permissions:
      contents: read
      packages: read
    uses: $/.github/workflows/debusine-build.yml
    with:
      target_branch: ${{ inputs.target_branch }}
      qli-ci-ref: ${{ inputs.qli-ci-ref }}
      debusine-parent-workspace: ${{ inputs.debusine-parent-workspace }}
      workflow_kind: ${{ inputs.workflow_kind }}
      job_index: ${{ inputs.job_index }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}

  # The AXIOM check runs inside debusine-build.yml, after its Build job, so it
  # gates publish through needs: build: a failed or cancelled check fails the
  # build workflow and publish is skipped, and a disabled (skipped) check
  # does not. Do not add always() or result checks here, which would bypass it.
  publish:
    name: Publish
    needs: build
    if: ${{ inputs.release }}
    permissions:
      contents: write
      deployments: write
      packages: read
    uses: $/.github/workflows/debusine-publish.yml
    with:
      target_branch: ${{ inputs.target_branch }}
      # Same default as debusine-source-package.yml: push-release must push on
      # top of the ref the release was prepared from.
      source_ref: ${{ inputs.source_ref || github.ref }}
      qli-ci-ref: ${{ inputs.qli-ci-ref }}
      job_index: ${{ inputs.job_index }}
      ci_workspace: ${{ needs.build.outputs.workspace }}
      srcpkg_name: ${{ needs.build.outputs.srcpkg_name }}
      srcpkg_version: ${{ needs.build.outputs.srcpkg_version }}
    secrets:
      DEBUSINE_RELEASE_TOKEN: ${{ secrets.DEBUSINE_RELEASE_TOKEN }}
