name: pkg-example e2e loop

description: |
  Runs pkg-example integration loops against the qli-ci ref under test:
  prebuilt promote lane first, then Debian and Ubuntu source lanes.
  Lifecycle: reset -> promote -> promotion PR build -> merge -> release.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      qli-ci-ref:
        description: qli-ci ref (commit SHA or branch) to test. Defaults to current commit SHA.
        type: string
        required: false
        default: ""
      qli-ci-pr-number:
        description: Optional qli-ci PR number for manual runs (used for reporting only).
        type: string
        required: false
        default: ""

concurrency:
  # Preempt stale runs only within the same PR/ref.
  group: pkg-example-e2e-loop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-relevant-changes:
    name: Check relevant changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - name: Determine whether changed files warrant a run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Manual dispatch is always an explicit request to run.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          echo "Changed files:"
          echo "${files}"

          relevant="false"
          docs_only="true"
          while IFS= read -r f; do
            [[ -z "${f}" ]] && continue
            if [[ "${f}" != *.md ]]; then
              docs_only="false"
            fi
            if [[ "${f}" == .github/workflows/pkg-*-reusable-workflow.yml ]] \
              || [[ "${f}" == scripts/* ]] \
              || [[ "${f}" == pkg-workflows/* ]]; then
              relevant="true"
            fi
          done <<< "${files}"

          # Documentation-only changes never warrant a run, even if a
          # matched path (e.g. a README under pkg-workflows/) triggered it.
          if [[ "${docs_only}" == "true" ]]; then
            relevant="false"
          fi

          echo "relevant=${relevant}" >> "$GITHUB_OUTPUT"

  global-lock:
    name: pkg-example e2e (global slot)
    needs: [check-relevant-changes]
    if: ${{ needs.check-relevant-changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      # Ensure only one pkg-example e2e run is active globally across all PRs.
      group: pkg-example-e2e-loop-global
      cancel-in-progress: false
    steps:
      - name: Acquire global slot
        run: echo "Acquired global pkg-example e2e slot"

  prebuilt-promote-lane:
    name: pkg-example e2e (prebuilt promote lane)
    needs: [global-lock]
    if: ${{ vars.ENABLE_PREBUILT_PATH != '0' }}
    runs-on: ubuntu-latest
    env:
      SUMMARY_FILE: /tmp/pkg-example-e2e-prebuilt-summary.md
      STATE_FILE: /tmp/pkg-example-e2e-prebuilt-state.json
      ENABLE_DEBIAN_PATH: "0"
      ENABLE_UBUNTU_PATH: "1"
      PROMOTE_MODE: prebuilt

    steps:
      - name: Checkout qli-ci
        uses: actions/checkout@v5

      - name: Resolve run parameters
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail

          qli_ci_ref=""
          qli_ci_pr_number=""
          is_fork_pr="false"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            qli_ci_ref="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")"
            qli_ci_pr_number="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
            pr_is_fork="$(jq -r '.pull_request.head.repo.fork // false' "$GITHUB_EVENT_PATH")"
            if [[ "${pr_is_fork}" == "true" ]]; then
              is_fork_pr="true"
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            qli_ci_ref="$(jq -r '.inputs["qli-ci-ref"] // empty' "$GITHUB_EVENT_PATH")"
            qli_ci_pr_number="$(jq -r '.inputs["qli-ci-pr-number"] // empty' "$GITHUB_EVENT_PATH")"
          fi

          if [[ -z "${qli_ci_ref}" ]]; then
            qli_ci_ref="${GITHUB_SHA_VALUE}"
          fi

          if [[ -z "${qli_ci_ref}" ]]; then
            echo "Unable to resolve qli-ci ref under test" >&2
            exit 1
          fi

          echo "qli_ci_ref=${qli_ci_ref}" >> "$GITHUB_OUTPUT"
          echo "qli_ci_pr_number=${qli_ci_pr_number}" >> "$GITHUB_OUTPUT"
          echo "is_fork_pr=${is_fork_pr}" >> "$GITHUB_OUTPUT"

      - name: Initialize e2e state
        env:
          QLI_CI_REF: ${{ steps.resolve.outputs.qli_ci_ref }}
          QLI_CI_PR_NUMBER: ${{ steps.resolve.outputs.qli_ci_pr_number }}
          IS_FORK_PR: ${{ steps.resolve.outputs.is_fork_pr }}
          STATE_FILE: ${{ env.STATE_FILE }}
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
          ENABLE_DEBIAN_PATH: ${{ env.ENABLE_DEBIAN_PATH }}
          ENABLE_UBUNTU_PATH: ${{ env.ENABLE_UBUNTU_PATH }}
          PROMOTE_MODE: ${{ env.PROMOTE_MODE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh init

      - name: Prepare temp pkg-example branch
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          QLI_CI_REF: ${{ steps.resolve.outputs.qli_ci_ref }}
          STATE_FILE: ${{ env.STATE_FILE }}
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh prepare-temp-branch

      - name: Prebuilt reset (ubuntu lane)
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh reset-lane ubuntu

      - name: Prebuilt seed ubuntu branch
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh seed-ubuntu

      - name: Install arm64 cross compiler (prebuilt fixtures)
        run: |
          set -euo pipefail
          if ! command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes gcc-aarch64-linux-gnu
          fi

      - name: Prebuilt seed fixture artifacts
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh seed-prebuilt-fixtures ubuntu

      - name: Prebuilt v1.0.0 promote
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
          PROMOTE_MODE: ${{ env.PROMOTE_MODE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh promote-tag ubuntu v1.0.0

      - name: Prebuilt v1.0.0 sync PR hook
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          QLI_CI_REF: ${{ steps.resolve.outputs.qli_ci_ref }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh sync-pr-hook ubuntu v1.0.0

      - name: Prebuilt v1.0.0 PR build
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh wait-pr-build ubuntu v1.0.0

      - name: Prebuilt v1.0.0 merge PR
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh merge-pr ubuntu v1.0.0

      - name: Prebuilt v1.0.0 release
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh release-tag ubuntu v1.0.0

      - name: Build prebuilt summary
        if: ${{ always() }}
        env:
          STATE_FILE: ${{ env.STATE_FILE }}
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh write-summary

      - name: Append prebuilt summary to workflow
        if: ${{ always() }}
        env:
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
        run: |
          set -euo pipefail
          if [[ -f "${SUMMARY_FILE}" ]]; then
            cat "${SUMMARY_FILE}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## pkg-example e2e prebuilt promote lane" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No summary was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup temp branch and workspace
        if: ${{ always() }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh cleanup

  debian-lane:
    name: pkg-example e2e (debian lane)
    needs: [global-lock, prebuilt-promote-lane]
    if: ${{ !cancelled() && always() && vars.ENABLE_DEBIAN_PATH == '1' && needs.global-lock.result == 'success' && contains(fromJson('["success","failure","skipped"]'), needs.prebuilt-promote-lane.result) }}
    runs-on: ubuntu-latest
    env:
      SUMMARY_FILE: /tmp/pkg-example-e2e-summary.md
      STATE_FILE: /tmp/pkg-example-e2e-state.json
      ENABLE_DEBIAN_PATH: ${{ vars.ENABLE_DEBIAN_PATH }}
      ENABLE_UBUNTU_PATH: ${{ vars.ENABLE_UBUNTU_PATH }}
      PROMOTE_MODE: source

    steps:
      - name: Checkout qli-ci
        uses: actions/checkout@v5

      - name: Resolve run parameters
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail

          qli_ci_ref=""
          qli_ci_pr_number=""
          is_fork_pr="false"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            qli_ci_ref="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")"
            qli_ci_pr_number="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
            pr_is_fork="$(jq -r '.pull_request.head.repo.fork // false' "$GITHUB_EVENT_PATH")"
            if [[ "${pr_is_fork}" == "true" ]]; then
              is_fork_pr="true"
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            qli_ci_ref="$(jq -r '.inputs["qli-ci-ref"] // empty' "$GITHUB_EVENT_PATH")"
            qli_ci_pr_number="$(jq -r '.inputs["qli-ci-pr-number"] // empty' "$GITHUB_EVENT_PATH")"
          fi

          if [[ -z "${qli_ci_ref}" ]]; then
            qli_ci_ref="${GITHUB_SHA_VALUE}"
          fi

          if [[ -z "${qli_ci_ref}" ]]; then
            echo "Unable to resolve qli-ci ref under test" >&2
            exit 1
          fi

          echo "qli_ci_ref=${qli_ci_ref}" >> "$GITHUB_OUTPUT"
          echo "qli_ci_pr_number=${qli_ci_pr_number}" >> "$GITHUB_OUTPUT"
          echo "is_fork_pr=${is_fork_pr}" >> "$GITHUB_OUTPUT"

      - name: Initialize e2e state
        env:
          QLI_CI_REF: ${{ steps.resolve.outputs.qli_ci_ref }}
          QLI_CI_PR_NUMBER: ${{ steps.resolve.outputs.qli_ci_pr_number }}
          IS_FORK_PR: ${{ steps.resolve.outputs.is_fork_pr }}
          STATE_FILE: ${{ env.STATE_FILE }}
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
          ENABLE_DEBIAN_PATH: ${{ env.ENABLE_DEBIAN_PATH }}
          ENABLE_UBUNTU_PATH: ${{ env.ENABLE_UBUNTU_PATH }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh init

      - name: Prepare temp pkg-example branch
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          QLI_CI_REF: ${{ steps.resolve.outputs.qli_ci_ref }}
          STATE_FILE: ${{ env.STATE_FILE }}
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh prepare-temp-branch

      - name: Debian reset
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh reset-lane debian

      - name: Debian v1.0.0 promote
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh promote-tag debian v1.0.0

      - name: Debian v1.0.0 sync PR hook
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          QLI_CI_REF: ${{ steps.resolve.outputs.qli_ci_ref }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh sync-pr-hook debian v1.0.0

      - name: Debian v1.0.0 PR build
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh wait-pr-build debian v1.0.0

      - name: Debian v1.0.0 merge PR
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh merge-pr debian v1.0.0

      - name: Debian v1.0.0 release
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh release-tag debian v1.0.0

      - name: Debian v1.1.0 promote
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh promote-tag debian v1.1.0

      - name: Debian v1.1.0 sync PR hook
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          QLI_CI_REF: ${{ steps.resolve.outputs.qli_ci_ref }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh sync-pr-hook debian v1.1.0

      - name: Debian v1.1.0 PR build
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh wait-pr-build debian v1.1.0

      - name: Debian v1.1.0 merge PR
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh merge-pr debian v1.1.0

      - name: Debian v1.1.0 release
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh release-tag debian v1.1.0

      - name: Upload shared e2e state
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pkg-example-e2e-state-${{ github.run_id }}
          path: ${{ env.STATE_FILE }}
          if-no-files-found: error
          retention-days: 1

  ubuntu-lane:
    name: pkg-example e2e (ubuntu lane)
    runs-on: ubuntu-latest
    needs: [global-lock, debian-lane]
    if: ${{ !cancelled() && always() && vars.ENABLE_UBUNTU_PATH == '1' && needs.global-lock.result == 'success' && contains(fromJson('["success","failure","skipped"]'), needs.debian-lane.result) }}
    env:
      SUMMARY_FILE: /tmp/pkg-example-e2e-summary.md
      STATE_FILE: /tmp/pkg-example-e2e-state.json
      ENABLE_DEBIAN_PATH: ${{ vars.ENABLE_DEBIAN_PATH }}
      ENABLE_UBUNTU_PATH: ${{ vars.ENABLE_UBUNTU_PATH }}
      PROMOTE_MODE: source

    steps:
      - name: Checkout qli-ci
        uses: actions/checkout@v5

      - name: Resolve run parameters
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail

          qli_ci_ref=""
          qli_ci_pr_number=""
          is_fork_pr="false"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            qli_ci_ref="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")"
            qli_ci_pr_number="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
            pr_is_fork="$(jq -r '.pull_request.head.repo.fork // false' "$GITHUB_EVENT_PATH")"
            if [[ "${pr_is_fork}" == "true" ]]; then
              is_fork_pr="true"
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            qli_ci_ref="$(jq -r '.inputs["qli-ci-ref"] // empty' "$GITHUB_EVENT_PATH")"
            qli_ci_pr_number="$(jq -r '.inputs["qli-ci-pr-number"] // empty' "$GITHUB_EVENT_PATH")"
          fi

          if [[ -z "${qli_ci_ref}" ]]; then
            qli_ci_ref="${GITHUB_SHA_VALUE}"
          fi

          if [[ -z "${qli_ci_ref}" ]]; then
            echo "Unable to resolve qli-ci ref under test" >&2
            exit 1
          fi

          echo "qli_ci_ref=${qli_ci_ref}" >> "$GITHUB_OUTPUT"
          echo "qli_ci_pr_number=${qli_ci_pr_number}" >> "$GITHUB_OUTPUT"
          echo "is_fork_pr=${is_fork_pr}" >> "$GITHUB_OUTPUT"

      - name: Download shared e2e state
        id: download_state
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pkg-example-e2e-state-${{ github.run_id }}
          path: /tmp

      - name: Initialize e2e state (ubuntu fallback)
        if: ${{ steps.download_state.outcome != 'success' }}
        env:
          QLI_CI_REF: ${{ steps.resolve.outputs.qli_ci_ref }}
          QLI_CI_PR_NUMBER: ${{ steps.resolve.outputs.qli_ci_pr_number }}
          IS_FORK_PR: ${{ steps.resolve.outputs.is_fork_pr }}
          STATE_FILE: ${{ env.STATE_FILE }}
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
          ENABLE_DEBIAN_PATH: ${{ env.ENABLE_DEBIAN_PATH }}
          ENABLE_UBUNTU_PATH: ${{ env.ENABLE_UBUNTU_PATH }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh init

      - name: Prepare temp pkg-example branch
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          QLI_CI_REF: ${{ steps.resolve.outputs.qli_ci_ref }}
          STATE_FILE: ${{ env.STATE_FILE }}
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh prepare-temp-branch

      - name: Ubuntu reset
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh reset-lane ubuntu

      - name: Ubuntu seed branch
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh seed-ubuntu

      - name: Ubuntu v1.0.0 promote
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh promote-tag ubuntu v1.0.0

      - name: Ubuntu v1.0.0 sync PR hook
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          QLI_CI_REF: ${{ steps.resolve.outputs.qli_ci_ref }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh sync-pr-hook ubuntu v1.0.0

      - name: Ubuntu v1.0.0 PR build
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh wait-pr-build ubuntu v1.0.0

      - name: Ubuntu v1.0.0 merge PR
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh merge-pr ubuntu v1.0.0

      - name: Ubuntu v1.0.0 release
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh release-tag ubuntu v1.0.0

      - name: Ubuntu curate post-release changelog (clear WIP)
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh curate-ubuntu-wip-after-first-release

      - name: Ubuntu v1.1.0 promote
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh promote-tag ubuntu v1.1.0

      - name: Ubuntu v1.1.0 sync PR hook
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          QLI_CI_REF: ${{ steps.resolve.outputs.qli_ci_ref }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh sync-pr-hook ubuntu v1.1.0

      - name: Ubuntu v1.1.0 PR build
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh wait-pr-build ubuntu v1.1.0

      - name: Ubuntu v1.1.0 merge PR
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh merge-pr ubuntu v1.1.0

      - name: Ubuntu v1.1.0 release
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh release-tag ubuntu v1.1.0

      - name: Build loop summary
        if: ${{ always() }}
        env:
          STATE_FILE: ${{ env.STATE_FILE }}
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh write-summary

      - name: Append summary to workflow
        if: ${{ always() }}
        env:
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
        run: |
          set -euo pipefail
          if [[ -f "${SUMMARY_FILE}" ]]; then
            cat "${SUMMARY_FILE}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## pkg-example e2e loop" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No summary was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upsert PR summary comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
        run: |
          set -euo pipefail

          marker="<!-- pkg-example-e2e-loop -->"
          if [[ -f "${SUMMARY_FILE}" ]]; then
            body_content="$(cat "${SUMMARY_FILE}")"
          else
            body_content="## pkg-example e2e loop\n\nNo summary was generated."
          fi

          full_body="${marker}"$'\n\n'"${body_content}"

          comments_json="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate)"
          existing_id="$(jq -r --arg marker "$marker" '.[] | select(.body | contains($marker)) | .id' <<<"$comments_json" | tail -n 1)"

          if [[ -n "${existing_id}" ]]; then
            jq -n --arg body "$full_body" '{body: $body}' \
              | gh api "repos/${REPO}/issues/comments/${existing_id}" --method PATCH --input - >/dev/null
          else
            jq -n --arg body "$full_body" '{body: $body}' \
              | gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --method POST --input - >/dev/null
          fi

      - name: Cleanup temp branch and workspace
        if: ${{ always() }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          STATE_FILE: ${{ env.STATE_FILE }}
        run: |
          set -euo pipefail
          ./scripts/pkg_example_e2e_loop.sh cleanup
