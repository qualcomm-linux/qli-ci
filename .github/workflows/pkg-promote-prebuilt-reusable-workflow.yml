name: Qualcomm Prebuilt Binary Promotion Reusable Workflow (Compatibility Wrapper)
description: |
  Backward-compatible wrapper for callers still using pkg-promote-prebuilt.
  The promotion logic now lives in pkg-promote-reusable-workflow.yml.

on:
  workflow_call:
    inputs:
      qli-ci-ref:
        description: The ref name that was used to invoke this reusable workflow
        type: string
        required: true

      debian-branch:
        description: The debian branch to apply the promotion to. For example "qcom/debian/latest"
        type: string
        required: false
        default: qcom/debian/latest

      new-tag:
        description: |
          The new Artifactory TAG value to promote to (e.g. 251030.2).
          This updates the TAG field in upstream.conf.
        type: string
        required: true

      new-package-name:
        description: |
          The new tarball filename if it has changed.
          If omitted, the existing PACKAGE_NAME in upstream.conf is kept unchanged.
        type: string
        required: false
        default: ""

      new-debian-version:
        description: |
          The new debian changelog version.
          If omitted, the version is automatically derived from PACKAGE_NAME.
        type: string
        required: false
        default: ""

    secrets:
      DEB_PKG_BOT_CI_TOKEN:
        required: true

permissions:
  contents: write
  packages: read
  pull-requests: write

jobs:
  promote-prebuilt:
    uses: qualcomm-linux/qli-ci/.github/workflows/pkg-promote-reusable-workflow.yml@main
    with:
      qli-ci-ref: ${{ inputs.qli-ci-ref }}
      debian-branch: ${{ inputs.debian-branch }}
      upstream-tag: ""
      upstream-repo: ${{ vars.UPSTREAM_REPO_GITHUB_NAME }}
      new-tag: ${{ inputs.new-tag }}
      new-package-name: ${{ inputs.new-package-name }}
      new-debian-version: ${{ inputs.new-debian-version }}
    secrets:
      PAT: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
