name: Qualcomm Promotion Reusable Workflow
description: |
  Unified promotion workflow for source-based and prebuilt package repositories.
  Mode is auto-detected from the packaging branch:
    - prebuilt when prebuild.conf/prebuilt.conf/upstream.conf exists
    - source otherwise

on:
  workflow_call:
    inputs:

      qli-ci-ref:
        description: The ref name that was used to invoke this reusable workflow
        type: string
        required: true

      debian-branch:
        description: The debian branch to apply the promotion to. For example branch "qcom/debian/latest"
        type: string
        required: true

      upstream-tag:
        description: |
          Source mode: tag in the upstream repository to promote.
          Prebuilt mode: optional alias for new-tag.
        type: string
        required: false
        default: ""

      upstream-repo:
        description: |
          Source mode only: upstream git repository address, for example
          "qualcomm-linux/upstream-project".
        type: string
        required: false
        default: ""

      new-tag:
        description: |
          Prebuilt mode: new Artifactory TAG value to promote to.
          Source mode: optional alias for upstream-tag.
        type: string
        required: false
        default: ""

      new-package-name:
        description: |
          Prebuilt mode only: new tarball filename if it changed.
          If omitted, keeps PACKAGE_NAME from upstream.conf unchanged.
        type: string
        required: false
        default: ""

      new-debian-version:
        description: |
          Prebuilt mode only: changelog version override.
          If omitted, derived from PACKAGE_NAME.
        type: string
        required: false
        default: ""

    secrets:
      PAT:
        required: false
      DEB_PKG_BOT_CI_TOKEN:
        required: false

permissions:
  contents: write
  packages: read
  pull-requests: write

env:
  NORMALIZED_VERSION: ""
  PROMOTION_VERSION: ""
  PROMOTION_BRANCH_VERSION: ""
  PROMOTION_PR_BRANCH: ""
  PACKAGE_VERSION_IDENTIFIER: ""
  UPSTREAM_PROMOTED_TAG: ""
  UPSTREAM_TAG_TEMPLATE: ""
  UPSTREAM_TAG_ALREADY_EXISTS: false

jobs:
  resolve-promote-mode:
    name: Resolve Promotion Mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      effective-tag: ${{ steps.resolve.outputs.effective_tag }}
      prebuilt-gate-file: ${{ steps.resolve.outputs.prebuilt_gate_file }}

    steps:
      - name: Checkout Packaging Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.debian-branch }}

      - name: Resolve mode and effective promotion tag
        id: resolve
        env:
          INPUTS_UPSTREAM_TAG: ${{ inputs.upstream-tag }}
          INPUTS_NEW_TAG: ${{ inputs.new-tag }}
          INPUTS_UPSTREAM_REPO: ${{ inputs.upstream-repo }}
        run: |
          set -euo pipefail

          mode="source"
          prebuilt_gate_file=""

          if [[ -f "prebuild.conf" ]]; then
            mode="prebuilt"
            prebuilt_gate_file="prebuild.conf"
          elif [[ -f "prebuilt.conf" ]]; then
            mode="prebuilt"
            prebuilt_gate_file="prebuilt.conf"
          elif [[ -f "upstream.conf" ]]; then
            mode="prebuilt"
            prebuilt_gate_file="upstream.conf"
          fi

          if [[ "$mode" == "prebuilt" ]]; then
            if [[ -n "$INPUTS_UPSTREAM_TAG" && -n "$INPUTS_NEW_TAG" && "$INPUTS_UPSTREAM_TAG" != "$INPUTS_NEW_TAG" ]]; then
              echo "❌ upstream-tag and new-tag were both provided with different values." >&2
              echo "❌ Provide only one tag input, or provide identical values." >&2
              exit 1
            fi

            effective_tag="${INPUTS_NEW_TAG:-$INPUTS_UPSTREAM_TAG}"
            if [[ -z "$effective_tag" ]]; then
              echo "❌ Prebuilt promotion requires new-tag (or upstream-tag alias)." >&2
              exit 1
            fi
          else
            if [[ -n "$INPUTS_UPSTREAM_TAG" && -n "$INPUTS_NEW_TAG" && "$INPUTS_UPSTREAM_TAG" != "$INPUTS_NEW_TAG" ]]; then
              echo "❌ upstream-tag and new-tag were both provided with different values." >&2
              echo "❌ Provide only one tag input, or provide identical values." >&2
              exit 1
            fi

            effective_tag="${INPUTS_UPSTREAM_TAG:-$INPUTS_NEW_TAG}"
            if [[ -z "$effective_tag" ]]; then
              echo "❌ Source promotion requires upstream-tag (or new-tag alias)." >&2
              exit 1
            fi

            if [[ -z "${INPUTS_UPSTREAM_REPO}" ]]; then
              echo "❌ Source promotion requires upstream-repo." >&2
              exit 1
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "effective_tag=$effective_tag" >> "$GITHUB_OUTPUT"
          echo "prebuilt_gate_file=$prebuilt_gate_file" >> "$GITHUB_OUTPUT"

          echo "ℹ️ Resolved promotion mode: $mode"
          echo "ℹ️ Effective promotion tag: $effective_tag"
          if [[ -n "$prebuilt_gate_file" ]]; then
            echo "ℹ️ Prebuilt mode gated by: $prebuilt_gate_file"
          fi

  promote-upstream-version:
    name: Promote (source mode)
    needs: [resolve-promote-mode]
    if: ${{ needs.resolve-promote-mode.outputs.mode == 'source' }}

    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        shell: bash

    container:
      # This docker image is built and published by the qualcomm-linux/docker-pkg-build repo CI workflow
      image: ghcr.io/qualcomm-linux/pkg-builder:noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      INPUTS_UPSTREAM_TAG: ${{ needs.resolve-promote-mode.outputs.effective-tag }}
      INPUTS_UPSTREAM_REPO: ${{ inputs.upstream-repo }}
      PROMOTE_TOKEN: ${{ secrets.PAT || secrets.DEB_PKG_BOT_CI_TOKEN }}

    steps:
      - name: Validate promotion token
        run: |
          if [[ -z "${PROMOTE_TOKEN}" ]]; then
            echo "❌ No promotion token was provided."
            echo "❌ Provide PAT or DEB_PKG_BOT_CI_TOKEN."
            exit 1
          fi

      # Normalizing a tag : (e.g ) v1.0.0 -> 1.0.0
      - name: Normalize Tag Version
        run: |
          echo "ℹ️ Input upstream-tag is : ${INPUTS_UPSTREAM_TAG}"

          NORMALIZED_VERSION=$(echo "${INPUTS_UPSTREAM_TAG}" | sed 's/^v//')
          echo "NORMALIZED_VERSION=$NORMALIZED_VERSION" >> $GITHUB_ENV

          echo "ℹ️ Normalized version : $NORMALIZED_VERSION"

      # Resolve the Debian revision style from the packaging branch prefix.
      #
      # The plain "-1" revision is reserved for packages that are headed to
      # Debian itself (branches under "debian/"). Every other packaging branch
      # is a Qualcomm derivative and must carry a vendor suffix, mirroring the
      # branch -> identifier mapping implemented in debusine-action
      # (.github/workflows/debusine.yml). A brand new upstream release then
      # gets a "-0<identifier>1" revision, analogous to Debian's "-0ubuntu1"
      # scheme for Ubuntu packages that are not (yet) in Debian:
      #
      #   debian/*       -> <version>-1              (bound for Debian)
      #   qli/*, qcom/*  -> <version>-0qli1
      #   qli-staging/*  -> <version>-0qli+staging1
      #   ubuntu/*       -> <version>-0ubuntu1       (bound for Ubuntu)
      #
      # The revision is suffixed with "~" so that local builds from the branch
      # can easily be distinguished from official builds that will strip the ~
      - name: Resolve promotion changelog revision
        env:
          INPUTS_DEBIAN_BRANCH: ${{inputs.debian-branch}}
        run: |
          set -euo pipefail

          sanitize_version_for_ref() {
            local version="$1"
            local transformed sanitized

            transformed="$(echo "$version" | perl -pe 'y/:~/%_/; s/\.(?=\.|$|lock$)/.#/g')"
            sanitized="$(echo "$transformed" | sed 's/[^A-Za-z0-9.+%_#()-]//g')"
            if [[ "$sanitized" != "$transformed" ]]; then
              echo "❌ Transformed promotion version '$transformed' contains unsupported characters for a git ref." >&2
              exit 1
            fi

            echo "$sanitized"
          }

          case "${INPUTS_DEBIAN_BRANCH}" in
            debian/*)
              PACKAGE_VERSION_IDENTIFIER=""
              PROMOTION_VERSION="${NORMALIZED_VERSION}-1"
              ;;
            qli-staging/*)
              PACKAGE_VERSION_IDENTIFIER="qli+staging"
              PROMOTION_VERSION="${NORMALIZED_VERSION}-0qli+staging1"
              ;;
            qli/*|qcom/*)
              PACKAGE_VERSION_IDENTIFIER="qli"
              PROMOTION_VERSION="${NORMALIZED_VERSION}-0qli1"
              ;;
            ubuntu/*)
              PACKAGE_VERSION_IDENTIFIER=""
              PROMOTION_VERSION="${NORMALIZED_VERSION}-0ubuntu1"
              ;;
            *)
              echo "❌ Unsupported debian-branch prefix '${INPUTS_DEBIAN_BRANCH}'."
              echo "❌ Expected one of: debian/*, qli/*, qli-staging/*, qcom/*, ubuntu/*."
              exit 1
              ;;
          esac
          # helps distinguishing local builds
          PROMOTION_VERSION="${PROMOTION_VERSION}~"
          PROMOTION_BRANCH_VERSION="$(sanitize_version_for_ref "${PROMOTION_VERSION}")"
          PROMOTION_PR_BRANCH="debian/pr/${PROMOTION_BRANCH_VERSION}"
          if ! git check-ref-format "refs/heads/${PROMOTION_PR_BRANCH}"; then
            echo "❌ Computed promotion PR branch '${PROMOTION_PR_BRANCH}' is not a valid git ref."
            exit 1
          fi

          echo "PACKAGE_VERSION_IDENTIFIER=$PACKAGE_VERSION_IDENTIFIER" >> "$GITHUB_ENV"
          echo "PROMOTION_VERSION=$PROMOTION_VERSION" >> "$GITHUB_ENV"
          echo "PROMOTION_BRANCH_VERSION=$PROMOTION_BRANCH_VERSION" >> "$GITHUB_ENV"
          echo "PROMOTION_PR_BRANCH=$PROMOTION_PR_BRANCH" >> "$GITHUB_ENV"

          echo "ℹ️ Packaging branch: ${INPUTS_DEBIAN_BRANCH}"
          echo "ℹ️ Vendor identifier: ${PACKAGE_VERSION_IDENTIFIER:-<none, Debian-bound>}"
          echo "ℹ️ Promotion changelog version: $PROMOTION_VERSION"
          echo "ℹ️ Promotion PR branch: ${PROMOTION_PR_BRANCH}"

      - name: Checkout qli-ci
        uses: actions/checkout@v5
        with:
          repository: qualcomm-linux/qli-ci
          ref: ${{inputs.qli-ci-ref}}
          token: ${{ env.PROMOTE_TOKEN }}
          path: ./qli-ci
          fetch-depth: 1
          sparse-checkout: |
            .github
            scripts

      # Fetch all history for all tags and branches
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ env.PROMOTE_TOKEN }}
          path: ./package-repo
          fetch-depth: 0

      - name: Authenticate with GitHub
        run : |
          gh auth login --with-token <<< "${PROMOTE_TOKEN}"

      - name: Show branches/tags and checkout debian/upstream latest
        working-directory: ./package-repo
        env:
          INPUTS_DEBIAN_BRANCH: ${{inputs.debian-branch}}
        run: |
          git branch
          git tag
          git checkout ${INPUTS_DEBIAN_BRANCH}
          echo "Listing all the current tags :"
          git tag --list
          if git ls-remote --exit-code --heads origin upstream/latest; then
            git checkout upstream/latest # Checkout this branch just to make sure it exists locally after its been fetched as gbp will need it later
            git checkout - # Then revert back to the inputs.debian-branch branch as we will need to have it checked out for gbp later
          fi

      - name: Resolve promoted upstream tag schema
        working-directory: ./package-repo
        run: |
          # This should resolve from debian/gbp.conf when set. If no explicit
          # value is set, fallback to gbp default template.
          UPSTREAM_TAG_TEMPLATE="$(gbp config buildpackage.upstream-tag 2>/dev/null || true)"
          if [ -z "$UPSTREAM_TAG_TEMPLATE" ]; then
            UPSTREAM_TAG_TEMPLATE='upstream/%(version)s'
            echo "ℹ️ buildpackage.upstream-tag not set; using default '$UPSTREAM_TAG_TEMPLATE'"
          fi

          if ! echo "$UPSTREAM_TAG_TEMPLATE" | grep -qF '%(version)s'; then
            echo "❌ Unsupported buildpackage.upstream-tag value '$UPSTREAM_TAG_TEMPLATE' (missing '%(version)s')."
            exit 1
          fi

          SANITIZED_TEMPLATE="$(echo "$UPSTREAM_TAG_TEMPLATE" | sed 's/[^A-Za-z0-9.+/%_#()-]//g')"
          if [ "$SANITIZED_TEMPLATE" != "$UPSTREAM_TAG_TEMPLATE" ]; then
            echo "❌ Unsupported buildpackage.upstream-tag value '$UPSTREAM_TAG_TEMPLATE' (contains unsafe characters)."
            exit 1
          fi

          transformed_version="$(echo "$NORMALIZED_VERSION" | perl -pe 'y/:~/%_/; s/\.(?=\.|$|lock$)/.#/g')"
          RESOLVED_PROMOTED_TAG_RAW="$(echo "$UPSTREAM_TAG_TEMPLATE" | sed "s|%(version)s|$transformed_version|g")"
          UPSTREAM_PROMOTED_TAG="$(echo "$RESOLVED_PROMOTED_TAG_RAW" | sed 's/[^A-Za-z0-9.+/%_#()-]//g')"
          if [ "$UPSTREAM_PROMOTED_TAG" != "$RESOLVED_PROMOTED_TAG_RAW" ]; then
            echo "❌ Resolved promoted upstream tag '$RESOLVED_PROMOTED_TAG_RAW' contains unsupported characters."
            exit 1
          fi

          if ! git check-ref-format "refs/tags/$UPSTREAM_PROMOTED_TAG"; then
            echo "❌ Computed promoted upstream tag '$UPSTREAM_PROMOTED_TAG' is not a valid git ref."
            exit 1
          fi

          echo "UPSTREAM_TAG_TEMPLATE=$UPSTREAM_TAG_TEMPLATE" >> "$GITHUB_ENV"
          echo "UPSTREAM_PROMOTED_TAG=$UPSTREAM_PROMOTED_TAG" >> "$GITHUB_ENV"

          echo "ℹ️ Using upstream tag template: $UPSTREAM_TAG_TEMPLATE"
          echo "ℹ️ Resolved promoted upstream tag: $UPSTREAM_PROMOTED_TAG"

      - name: Make sure the upstream tag is not already part of the repo
        working-directory: ./package-repo
        run: |
          if (git tag --list | grep "${INPUTS_UPSTREAM_TAG}"); then
            echo "❌ The supplied upstream tag is wrong as it pertains to this repo already."
            exit 1
          fi

      - name: Validate the upstream tag promotion state
        working-directory: ./package-repo
        run: |
          # Check if the resolved promoted tag does not already exist
          if ! git rev-parse --verify "refs/tags/${{env.UPSTREAM_PROMOTED_TAG}}" >/dev/null 2>&1; then
            echo "✅ The upstream tag '${INPUTS_UPSTREAM_TAG}' has not been promoted yet. Continuing."
            exit 0
          fi

          echo "⚠️ It appears like this repo has already integrated the upstream tag '${INPUTS_UPSTREAM_TAG}' as '${{env.UPSTREAM_PROMOTED_TAG}}'"

          PROMOTED_TAG_GLOB="${{env.UPSTREAM_TAG_TEMPLATE}}"
          PROMOTED_TAG_GLOB="${PROMOTED_TAG_GLOB//%(version)s/*}"
          LATEST_PROMOTED_TAG=$(git tag --list "$PROMOTED_TAG_GLOB" | sort -V | tail -1)

          if [ -z "$LATEST_PROMOTED_TAG" ]; then
            echo "❌ Could not determine the latest promoted upstream tag using pattern '$PROMOTED_TAG_GLOB'."
            exit 1
          fi

          echo "ℹ️ The latest promoted upstream tag in the repo is: $LATEST_PROMOTED_TAG"

          if [ "$LATEST_PROMOTED_TAG" != "${{env.UPSTREAM_PROMOTED_TAG}}" ]; then
            echo "❌ However, the existing tag '${{env.UPSTREAM_PROMOTED_TAG}}' is NOT the latest promoted upstream version"
            echo "❌ This means we are trying to promote an older tag. Aborting."
            exit 1
          fi

          echo "ℹ️ The existing tag '${{env.UPSTREAM_PROMOTED_TAG}}' maps to the latest normalized upstream version already."
          echo "ℹ️ This is likely a second attempt to promote the same upstream tag, where the first attempt already added the upstream tag in the upstram branch"

          # Check if there is a PR open for this already
          PRS=$(gh pr list --head "${PROMOTION_PR_BRANCH}" --state open --json number --jq '.[].number')
          if [ -n "$PRS" ]; then
            echo "❌ An open PR already exists for this promotion attempt: $PRS"
            echo "❌ Please merge or close the existing PR before attempting to promote the same upstream tag again."
            exit 1
          fi

          # If we reach this point, it means the upstream tag exists but no PR is open for it
          echo "⚠️ The upstream tag '${{env.UPSTREAM_PROMOTED_TAG}}' already exists but no PR is open for it."
          echo "⚠️ This likely means the previous promotion PR was closed without merging."
          echo "⚠️ We will proceed with the promotion, but please ensure to merge the resulting PR to avoid confusion like this."
          
          # Keep track that the upstream tag already exists
          echo "UPSTREAM_TAG_ALREADY_EXISTS=true" >> $GITHUB_ENV

          # Perform a last check to see if the debian/pr/<version> branch already exists locally (which would mean its also present remotely)
          if git ls-remote --exit-code --heads origin "${PROMOTION_PR_BRANCH}"; then
            echo "❌ The ${PROMOTION_PR_BRANCH} branch already exists remotely."
            echo "❌ This likely means the previous promotion PR branch was not deleted after closing the PR."
            echo "❌ Please delete the remote branch before attempting to promote the same upstream tag again."
            exit 1
          fi

      - name: Add Upstream Link As A Remote And Fetch Tags
        working-directory: ./package-repo
        run: |
          echo "ℹ️ Adding upstream remote with token authentication."
          REPO_URL=https://x-access-token:${PROMOTE_TOKEN}@github.com/${INPUTS_UPSTREAM_REPO}.git

          git remote add upstream-source $REPO_URL

          echo "ℹ️ Fetching tags from upstream repository using token authentication."

          # Override the global extraheader set by actions/checkout (GITHUB_TOKEN) which would otherwise
          # take precedence over the credentials embedded in the URL and prevent access to external repos.
          if ! git fetch upstream-source "+refs/tags/*:refs/tags/*"; then
            echo "❌ Failed to fetch tags from '${INPUTS_UPSTREAM_REPO}'."

            echo "❌ Ensure the promotion token has repository read access."
            echo "❌ For more information about this token, see the README.md in qli-ci repo."

            exit 1
          fi

      - name: Ensure the tag exists in the upstream repo
        working-directory: ./package-repo
        run: |
          if ! git rev-parse --verify "refs/tags/${INPUTS_UPSTREAM_TAG}" >/dev/null 2>&1; then
            echo "❌ The specified upstream tag '${INPUTS_UPSTREAM_TAG}' does not exist in the upstream repository."
            exit 1
          fi

      - name: Pre-populate the upstream/latest branch if first promotion
        run: |
          cd ./package-repo

          # If the upstream/latest branch does not exist yet, create it and give it
          # the history of upstream directly, instead of creating an --allow-empty commit
          # which will be dragged along.
          if ! git ls-remote --exit-code --heads origin upstream/latest; then
            git branch upstream/latest ${INPUTS_UPSTREAM_TAG}
          else
            # The branch exists, check it out and promote it to the upstream tag
            git checkout upstream/latest
            git merge --ff-only ${INPUTS_UPSTREAM_TAG}
          fi

      - name: Merge upstream tag into packaging branch
        working-directory: ./package-repo
        env:
          VARS_DEB_PKG_BOT_CI_NAME: ${{vars.DEB_PKG_BOT_CI_NAME}}
          VARS_DEB_PKG_BOT_CI_EMAIL: ${{vars.DEB_PKG_BOT_CI_EMAIL}}
          INPUTS_DEBIAN_BRANCH: ${{inputs.debian-branch}}
        run: |
          git config user.name "${VARS_DEB_PKG_BOT_CI_NAME}"
          git config user.email "${VARS_DEB_PKG_BOT_CI_EMAIL}"

          git checkout ${INPUTS_DEBIAN_BRANCH}

          git checkout -b "${PROMOTION_PR_BRANCH}"

          ../qli-ci/scripts/merge_debian_packaging_upstream ${INPUTS_UPSTREAM_TAG}

      - name: Sync PR hook workflow template
        working-directory: ./package-repo
        run: |
          mkdir -p .github/workflows
          cp ../qli-ci/.github/pkg-workflows/debian/pkg-pr-hook.yml .github/workflows/pkg-pr-hook.yml
          git add .github/workflows/pkg-pr-hook.yml

      - name: Promote Changelog
        working-directory: ./package-repo
        env:
          VARS_DEB_PKG_BOT_CI_NAME: ${{vars.DEB_PKG_BOT_CI_NAME}}
          VARS_DEB_PKG_BOT_CI_EMAIL: ${{vars.DEB_PKG_BOT_CI_EMAIL}}
        run: |
          export DEBFULLNAME="${VARS_DEB_PKG_BOT_CI_NAME}"
          export DEBEMAIL="${VARS_DEB_PKG_BOT_CI_EMAIL}"

          # use ignore branch because we are not on default debian branch
          dch \
            --distribution=UNRELEASED \
            --newversion=${{env.PROMOTION_VERSION}} \
            'New upstream release'

          git commit -a -s -m "Update changelog version to ${{env.PROMOTION_VERSION}} and UNRELEASED suite"

      - name: Push Upstream/latest and debian PR Branch
        working-directory: ./package-repo
        run: |
          if [ "${{env.UPSTREAM_TAG_ALREADY_EXISTS}}" = "false" ]; then
              # This is the happy path where no previous promotion attempt was detected

              # Push upstream/latest branch promoted to the tag
              git push origin upstream/latest

              git tag ${{env.UPSTREAM_PROMOTED_TAG}} upstream/latest

              # Push that new tag
              git push origin ${{env.UPSTREAM_PROMOTED_TAG}}
          fi

          git push origin "${PROMOTION_PR_BRANCH}"

      - name: Open Promotion PR
        working-directory: ./package-repo
        env:
          INPUTS_DEBIAN_BRANCH: ${{inputs.debian-branch}}
        run: |
          ../qli-ci/scripts/create_promotion_pr.py \
            --base-branch "${INPUTS_DEBIAN_BRANCH}" \
            --upstream-tag "${INPUTS_UPSTREAM_TAG}" \
            --normalized-version "${{env.NORMALIZED_VERSION}}" \
            --promotion-version "${{env.PROMOTION_VERSION}}" \
            --promotion-pr-branch "${{env.PROMOTION_PR_BRANCH}}" \
            --promoted-upstream-tag "${{env.UPSTREAM_PROMOTED_TAG}}"

  promote-prebuilt-version:
    name: Promote (prebuilt mode)
    needs: [resolve-promote-mode]
    if: ${{ needs.resolve-promote-mode.outputs.mode == 'prebuilt' }}

    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        shell: bash

    container:
      # This docker image is built and published by the qualcomm-linux/docker-pkg-build repo CI workflow
      image: ghcr.io/qualcomm-linux/pkg-builder:noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      INPUTS_NEW_TAG: ${{ needs.resolve-promote-mode.outputs.effective-tag }}
      PREBUILT_GATE_FILE: ${{ needs.resolve-promote-mode.outputs.prebuilt-gate-file }}
      PROMOTE_TOKEN: ${{ secrets.PAT || secrets.DEB_PKG_BOT_CI_TOKEN }}

    steps:
      - name: Validate promotion token
        run: |
          if [[ -z "${PROMOTE_TOKEN}" ]]; then
            echo "❌ No promotion token was provided."
            echo "❌ Provide PAT or DEB_PKG_BOT_CI_TOKEN."
            exit 1
          fi

      - name: Checkout qli-ci
        uses: actions/checkout@v5
        with:
          repository: qualcomm-linux/qli-ci
          ref: ${{ inputs.qli-ci-ref }}
          token: ${{ env.PROMOTE_TOKEN }}
          path: ./qli-ci
          fetch-depth: 1
          sparse-checkout: |
            .github
            scripts

      - name: Checkout Packaging Repo
        uses: actions/checkout@v5
        with:
          token: ${{ env.PROMOTE_TOKEN }}
          path: ./package-repo
          fetch-depth: 0
          fetch-tags: true

      - name: Validate and Read Current prebuilt config
        env:
          INPUTS_DEBIAN_BRANCH: ${{ inputs.debian-branch }}
        run: |
          set -euo pipefail
          cd ./package-repo

          git checkout "${INPUTS_DEBIAN_BRANCH}"

          if [[ -n "${PREBUILT_GATE_FILE}" ]]; then
            echo "ℹ️ Prebuilt mode gated by ${PREBUILT_GATE_FILE}"
          fi

          if [[ ! -f "upstream.conf" ]]; then
            echo "❌ upstream.conf not found in repository root."
            echo "❌ Prebuilt promotion requires upstream.conf to define ARTIFACTORY metadata."
            exit 1
          fi

          source upstream.conf

          for var in ARTIFACTORY TAG DISTRO PACKAGE_NAME; do
            if [[ -z "${!var}" ]]; then
              echo "❌ Required variable '$var' is not set in upstream.conf"
              exit 1
            fi
          done

          echo "ℹ️ Current upstream.conf:"
          echo "   ARTIFACTORY  : $ARTIFACTORY"
          echo "   TAG          : $TAG"
          echo "   DISTRO       : $DISTRO"
          echo "   PACKAGE_NAME : $PACKAGE_NAME"

          if [[ "$TAG" == "${INPUTS_NEW_TAG}" ]]; then
            echo "❌ The requested tag '${INPUTS_NEW_TAG}' is identical to current TAG '$TAG'."
            echo "❌ Nothing to promote."
            exit 1
          fi

          echo "CURRENT_TAG=$TAG" >> "$GITHUB_ENV"
          echo "CURRENT_PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACTORY=$ARTIFACTORY" >> "$GITHUB_ENV"
          echo "DISTRO=$DISTRO" >> "$GITHUB_ENV"

      - name: Resolve New Package Name and Debian Version
        env:
          INPUTS_NEW_PACKAGE_NAME: ${{ inputs.new-package-name }}
          INPUTS_NEW_DEBIAN_VERSION: ${{ inputs.new-debian-version }}
          INPUTS_DEBIAN_BRANCH: ${{ inputs.debian-branch }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUTS_NEW_PACKAGE_NAME}" ]]; then
            NEW_PACKAGE_NAME="${INPUTS_NEW_PACKAGE_NAME}"
            echo "ℹ️ Using provided new-package-name: $NEW_PACKAGE_NAME"
          else
            NEW_PACKAGE_NAME="${CURRENT_PACKAGE_NAME}"
            echo "ℹ️ No new-package-name provided, keeping current: $NEW_PACKAGE_NAME"
          fi
          echo "NEW_PACKAGE_NAME=$NEW_PACKAGE_NAME" >> "$GITHUB_ENV"

          if [[ -n "${INPUTS_NEW_DEBIAN_VERSION}" ]]; then
            NEW_DEBIAN_VERSION="${INPUTS_NEW_DEBIAN_VERSION}"
            echo "ℹ️ Using provided new-debian-version: $NEW_DEBIAN_VERSION"
          else
            derived_version="$(echo "$NEW_PACKAGE_NAME" | sed -n 's/^[^_]*_\([^_]*\)_.*/\1/p')"
            if [[ -z "$derived_version" ]]; then
              echo "❌ Could not derive Debian version from PACKAGE_NAME '$NEW_PACKAGE_NAME'."
              echo "❌ Expected format: <source>_<version>_<arch>.tar.gz"
              echo "❌ Provide new-debian-version explicitly."
              exit 1
            fi

            case "${INPUTS_DEBIAN_BRANCH}" in
              debian/*)
                NEW_DEBIAN_VERSION="${derived_version}-1"
                ;;
              qli-staging/*)
                NEW_DEBIAN_VERSION="${derived_version}-0qli+staging1"
                ;;
              qli/*|qcom/*)
                NEW_DEBIAN_VERSION="${derived_version}-0qli1"
                ;;
              ubuntu/*)
                NEW_DEBIAN_VERSION="${derived_version}-0ubuntu1"
                ;;
              *)
                echo "❌ Unsupported debian-branch prefix '${INPUTS_DEBIAN_BRANCH}'."
                echo "❌ Expected one of: debian/*, qli/*, qli-staging/*, qcom/*, ubuntu/*."
                exit 1
                ;;
            esac
          fi
          echo "NEW_DEBIAN_VERSION=$NEW_DEBIAN_VERSION" >> "$GITHUB_ENV"

          transformed="$(echo "$NEW_DEBIAN_VERSION" | perl -pe 'y/:~/%_/; s/\.(?=\.|$|lock$)/.#/g')"
          branch_version="$(echo "$transformed" | sed 's/[^A-Za-z0-9.+%_#()-]//g')"
          if [[ "$branch_version" != "$transformed" ]]; then
            echo "❌ Transformed Debian version '$transformed' contains unsupported characters for a git ref."
            exit 1
          fi

          PR_BRANCH="debian/pr/${branch_version}"
          if ! git check-ref-format "refs/heads/${PR_BRANCH}"; then
            echo "❌ Computed promotion PR branch '${PR_BRANCH}' is not a valid git ref."
            exit 1
          fi

          echo "PR_BRANCH=${PR_BRANCH}" >> "$GITHUB_ENV"

          echo "ℹ️ Promotion summary:"
          echo "   TAG          : ${CURRENT_TAG} -> ${INPUTS_NEW_TAG}"
          echo "   PACKAGE_NAME : ${CURRENT_PACKAGE_NAME} -> ${NEW_PACKAGE_NAME}"
          echo "   Debian ver   : ${NEW_DEBIAN_VERSION}"
          echo "   PR branch    : ${PR_BRANCH}"

      - name: Verify New Tarball Exists on Artifactory
        run: |
          set -euo pipefail

          DOWNLOAD_URL="${ARTIFACTORY}/${INPUTS_NEW_TAG}/${DISTRO}/${NEW_PACKAGE_NAME}"
          echo "ℹ️ Verifying tarball exists at: $DOWNLOAD_URL"

          if curl --head --fail --silent --show-error "$DOWNLOAD_URL"; then
            echo "✅ Tarball confirmed available on Artifactory"
          else
            echo "❌ Tarball not found at: $DOWNLOAD_URL"
            echo "❌ Please verify the promotion tag and package name."
            exit 1
          fi

      - name: Create Promotion Branch and Update upstream.conf
        env:
          VARS_DEB_PKG_BOT_CI_NAME: ${{ vars.DEB_PKG_BOT_CI_NAME }}
          VARS_DEB_PKG_BOT_CI_EMAIL: ${{ vars.DEB_PKG_BOT_CI_EMAIL }}
        run: |
          set -euo pipefail
          cd ./package-repo

          git config user.name "${VARS_DEB_PKG_BOT_CI_NAME}"
          git config user.email "${VARS_DEB_PKG_BOT_CI_EMAIL}"

          git checkout -b "${PR_BRANCH}"

          sed -i "s|^export TAG=.*|export TAG=\"${INPUTS_NEW_TAG}\"|" upstream.conf
          if [[ "${NEW_PACKAGE_NAME}" != "${CURRENT_PACKAGE_NAME}" ]]; then
            sed -i "s|^export PACKAGE_NAME=.*|export PACKAGE_NAME=\"${NEW_PACKAGE_NAME}\"|" upstream.conf
          fi

          echo "ℹ️ Updated upstream.conf:"
          cat upstream.conf | sed 's/^/   /'

      - name: Sync PR hook workflow template
        run: |
          set -euo pipefail
          cd ./package-repo

          mkdir -p .github/workflows
          cp ../qli-ci/.github/pkg-workflows/debian/pkg-pr-hook.yml .github/workflows/pkg-pr-hook.yml
          git add .github/workflows/pkg-pr-hook.yml

      - name: Bump Debian Changelog
        env:
          VARS_DEB_PKG_BOT_CI_NAME: ${{ vars.DEB_PKG_BOT_CI_NAME }}
          VARS_DEB_PKG_BOT_CI_EMAIL: ${{ vars.DEB_PKG_BOT_CI_EMAIL }}
        run: |
          set -euo pipefail
          cd ./package-repo

          export DEBFULLNAME="${VARS_DEB_PKG_BOT_CI_NAME}"
          export DEBEMAIL="${VARS_DEB_PKG_BOT_CI_EMAIL}"

          dch \
            --newversion="${NEW_DEBIAN_VERSION}" \
            --distribution=UNRELEASED \
            "New upstream release (Artifactory tag: ${INPUTS_NEW_TAG})"

          echo "ℹ️ Updated debian/changelog (first 5 lines):"
          head -5 debian/changelog | sed 's/^/   /'

      - name: Commit and Push Promotion Branch
        run: |
          set -euo pipefail
          cd ./package-repo

          git add upstream.conf debian/changelog
          git commit -s -m "Promote to Artifactory tag ${INPUTS_NEW_TAG} (version ${NEW_DEBIAN_VERSION})"

          git push origin "${PR_BRANCH}"

          git log --graph --oneline -n 5 --color=always

      - name: Open Promotion PR
        env:
          INPUTS_DEBIAN_BRANCH: ${{ inputs.debian-branch }}
        run: |
          set -euo pipefail
          cd ./package-repo

          gh auth login --with-token <<< "${PROMOTE_TOKEN}"

          PR_TITLE="Promotion to ${NEW_DEBIAN_VERSION} (Artifactory tag: ${INPUTS_NEW_TAG})"

          PR_BODY=$(cat <<EOF
          ## Automated prebuilt promotion PR

          This PR was generated by \`pkg-promote\` in prebuilt mode.

          ### Changes

          | Field | Old | New |
          |---|---|---|
          | Artifactory TAG | \`${CURRENT_TAG}\` | \`${INPUTS_NEW_TAG}\` |
          | PACKAGE_NAME | \`${CURRENT_PACKAGE_NAME}\` | \`${NEW_PACKAGE_NAME}\` |
          | Debian version | (previous) | \`${NEW_DEBIAN_VERSION}\` |

          ### Tarball verified at
          \`${ARTIFACTORY}/${INPUTS_NEW_TAG}/${DISTRO}/${NEW_PACKAGE_NAME}\`
          EOF
          )

          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base "${INPUTS_DEBIAN_BRANCH}" \
            --head "${PR_BRANCH}"
