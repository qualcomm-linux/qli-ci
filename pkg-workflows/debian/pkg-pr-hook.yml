name: PR Build Hook

# Untrusted half of PR Build: builds the PR head with no secrets (fork PRs
# get a read-only token and no secrets regardless of the permissions declared
# below, so it must not need any). The trusted half, pkg-pr-build-check.yml on
# the default branch, reacts to this run via workflow_run, takes its artifact
# as data, and posts the "PR Build" commit status.

on:
  pull_request:
    branches: [ debian/*, qcom/** ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: PR Build
    uses: qualcomm-linux/qli-ci/.github/workflows/pkg-pr-build-hook-reusable-workflow.yml@main
    with:
      qli-ci-ref: main
