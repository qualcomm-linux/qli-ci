# SEE README.debusine.md BEFORE CHANGING THIS FILE

# Note: in addition to the default branch, this workflow file must also be
# copied into each packaging branch in order to function as intended.

# This workflow intentionally does nothing except exist and complete: its
# only purpose is to give debusine-pr-check.yml's `workflow_run` trigger
# something to watch. It must not write anything (no commit statuses, no
# secrets): pull_request runs triggered by a fork get a read-only
# GITHUB_TOKEN and no repository secrets, regardless of the permissions
# declared below, so any write attempted here would fail for fork PRs. All
# status reporting (pending and final) happens in debusine-pr-check.yml,
# which runs in the trusted workflow_run context instead.

name: Debusine PR Hook

on:
  pull_request:
    branches:
      - 'qli/debian/**'
      - 'qli-staging/debian/**'
      - 'qcom/debian/**'

permissions:
  contents: read

jobs:
  acknowledge:
    name: Acknowledge PR
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "Debusine PR Check will report status for this commit."
