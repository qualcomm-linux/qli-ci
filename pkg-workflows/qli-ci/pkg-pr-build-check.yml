name: PR Build Check

on:
  # workflow_run is required here: the PR Build Hook (pkg-pr-hook.yml) runs in
  # the untrusted pull_request context (no secrets, and GITHUB_TOKEN is forced
  # read-only for forks), so the privileged CI work and commit-status updates
  # must run from this separate, trusted workflow. It never checks out or
  # executes PR code: the hook builds the PR, and this workflow only takes
  # that artifact as data (see pkg-build-reusable-workflow.yml's
  # import-pr-build input). The PR number and base ref are resolved via the
  # GitHub API from the trusted head_sha (not read from
  # workflow_run.pull_requests, which is empty for fork PRs). Permissions are
  # denied at the workflow level and granted per job below.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["PR Build Hook"]
    types:
      - completed

# Deny all permissions at the workflow level; each job grants only what it
# needs (see the per-job permissions blocks below).
permissions: {}

jobs:
  resolve-pr:
    name: Resolve PR from commit
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    # Reads PR metadata for the trusted head_sha and reports the initial
    # commit status. Nothing here writes repository contents.
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      family: ${{ steps.resolve.outputs.family }}
    steps:
      - id: resolve
        name: Resolve PR number and base ref from commit SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            // workflow_run.pull_requests is empty for fork PRs, and
            // listPullRequestsAssociatedWithCommit does not see commits
            // that only exist in a fork either. Listing open PRs by
            // <owner>:<branch> works for both; the head.sha equality
            // check below pins the result to the commit that actually ran,
            // so an attacker-chosen branch name cannot redirect it.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${process.env.HEAD_OWNER}:${process.env.HEAD_BRANCH}`,
              per_page: 100,
            });
            const matches = prs.filter((pr) => pr.head.sha === headSha);
            if (matches.length !== 1) {
              core.setFailed(`Expected exactly one open PR for commit ${headSha}, found ${matches.length}`);
              return;
            }
            const pr = matches[0];
            // Only picks which artifact to stage; pkg-build-reusable-workflow.yml
            // re-resolves and validates the base ref itself.
            const parts = pr.base.ref.split('/');
            const family = parts.length >= 2 ? parts[parts.length - 2] : '';
            if (family !== 'debian' && family !== 'ubuntu') {
              core.setFailed(`Unable to resolve distro family from base ref ${pr.base.ref}`);
              return;
            }
            core.setOutput('pr_number', pr.number);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('family', family);
            core.info(`Resolved commit ${headSha} to PR #${pr.number} (base: ${pr.base.ref}, family: ${family})`);

      - name: Set pending status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'pending',
              context: 'PR Build',
              description: 'Running PR Build...'
            });

  stage-pr-build:
    name: Stage untrusted PR build
    needs: resolve-pr
    runs-on: ubuntu-latest
    # Moves the hook run's artifact into this run, so
    # pkg-build-reusable-workflow.yml never needs actions: read.
    permissions:
      actions: read
    steps:
      - name: Download source package from the hook run
        if: ${{ needs.resolve-pr.outputs.family == 'debian' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-package-0
          path: untrusted-pr-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download build area from the hook run
        if: ${{ needs.resolve-pr.outputs.family == 'ubuntu' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-build-area
          path: untrusted-pr-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Re-upload into this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.resolve-pr.outputs.family == 'debian' && 'untrusted-source-package-0' || 'untrusted-docker-build-area' }}
          path: untrusted-pr-build
          if-no-files-found: error
          retention-days: 1

  build:
    name: PR Build
    needs: [resolve-pr, stage-pr-build]
    # Covers every job pkg-build-reusable-workflow.yml declares; GitHub
    # rejects the call before any job starts if the caller grants less. No PR
    # code runs under it: with import-pr-build, that workflow never checks
    # out the PR.
    permissions:
      contents: read
      packages: read
    uses: qualcomm-linux/qli-ci/.github/workflows/pkg-build-reusable-workflow.yml@main
    with:
      qli-ci-ref: main
      debian-ref: ${{ needs.resolve-pr.outputs.base_ref }}
      import-pr-build: true
      debusine-parent-workspace: ${{ vars.DEBUSINE_PARENT_WORKSPACE }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
      DEB_PKG_BOT_CI_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}

  set-final-status:
    name: Set PR Build Result
    runs-on: ubuntu-latest
    needs: build
    # A cancelled hook run was superseded by a newer push to the same PR,
    # whose own run reports the status for the new head SHA.
    if: ${{ always() && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    # Only needs to report the PR Build result as a commit status.
    permissions:
      statuses: write
    steps:
      - name: Set success status
        if: ${{ needs.build.result == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'success',
              context: 'PR Build',
              description: 'PR Build passed'
            });

      - name: Set failure status
        if: ${{ needs.build.result != 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'failure',
              context: 'PR Build',
              description: 'PR Build failed'
            });
